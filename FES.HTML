<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificado Festero VIP</title>

    <style>
        body {
            font-family: 'Georgia', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #050505;
            position: relative;
            overflow: hidden;
            color: white;
        }

        /* Fondo de estrellas */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 2px;
            height: 2px;
            background: transparent;
            box-shadow:
                10vw 20vh #fff,
                30vw 40vh #fff,
                50vw 10vh #fff,
                80vw 60vh #fff,
                20vw 80vh #fff,
                90vw 20vh #fff,
                40vw 90vh #fff,
                60vw 30vh #fff,
                15vw 50vh #fff,
                70vw 85vh #fff,
                85vw 10vh #fff,
                5vw 95vh #fff;
            opacity: 0.7;
            z-index: -1;
        }

        .container,
        #certificate-view {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px);
            border-radius: 15px;
            width: 90%;
            max-width: 700px;
            box-sizing: border-box;
            text-align: center;
            margin-top: 20px;
        }

        .container {
            padding: 30px;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 8px 32px rgba(0,0,0,0.37);
        }

        input[type="text"],
        select {
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
            width: 100%;
            box-sizing: border-box;
            font-size: 16px;
            background: rgba(255,255,255,0.05);
            color: white;
        }

        .btn-estilo-ui {
            background: linear-gradient(180deg, #2a2a40 0%, #151525 100%);
            color: #fff;
            padding: 15px 30px;
            border: 1px solid #444;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            margin-top: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: .3s;
        }

        .btn-estilo-ui:hover {
            transform: translateY(-2px);
        }

        /* CERTIFICADO PROFESIONAL */

        #certificate-view {
            display: none;
            background: linear-gradient(145deg,#111,#1b1b1b);
            border: 5px solid #d4af37;
            padding: 50px;
            box-shadow:
                0 0 30px rgba(212,175,55,.25),
                inset 0 0 20px rgba(212,175,55,.15);
        }

        .certificate-header h1 {
            color: #d4af37;
            margin: 0;
            font-size: 2.2rem;
            letter-spacing: 3px;
        }

        .subtitle {
            color: #ccc;
            font-style: italic;
            margin-top: 10px;
            margin-bottom: 40px;
        }

        .certificate-text {
            font-size: 18px;
            line-height: 1.8;
            color: #e5e5e5;
        }

        .name-highlight {
            display: block;
            font-size: 2.8rem;
            color: white;
            font-weight: bold;
            margin: 25px 0;
            padding-bottom: 15px;
            border-bottom: 3px solid #d4af37;
        }

        .title-highlight {
            font-size: 1.7rem;
            font-weight: bold;
            color: #ffd700;
            margin-top: 25px;
            text-transform: uppercase;
        }

        .gold-line {
            width: 200px;
            height: 2px;
            background: #d4af37;
            margin: 25px auto;
        }

        .certificate-footer {
            display: flex;
            justify-content: space-between;
            margin-top: 60px;
            gap: 20px;
        }

        .signature,
        .date {
            flex: 1;
            color: #ddd;
            font-size: 15px;
        }

        .signature-line {
            margin-bottom: 10px;
            border-top: 1px solid #d4af37;
            width: 80%;
            margin-left: auto;
            margin-right: auto;
            padding-top: 10px;
        }

        .seal {
            width: 110px;
            height: 110px;
            border: 3px solid #d4af37;
            border-radius: 50%;
            margin: 35px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #d4af37;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 0 15px rgba(212,175,55,.4);
        }
    </style>
</head>
<body>

<div class="container" id="initial-form">
    <h2>✨ ¡Comencemos la Celebración! ✨</h2>

    <label style="display:block;text-align:left;">Tu Nombre:</label>
    <input type="text" id="name-input" placeholder="Nombre completo">

    <label style="display:block;text-align:left;">Tu Género:</label>
    <select id="gender-select">
        <option value="male">Masculino</option>
        <option value="female">Femenino</option>
    </select>

    <button class="btn-estilo-ui" onclick="showEmail()">
        ¡Listo!
    </button>
</div>

<div class="container" id="email-view" style="display:none;">
    <h3>De: Salón de Eventos VIP 💌</h3>

    <p>Para:
        <span id="recipient-name"></span>
    </p>

    <hr>

    <p>
        Estimado/a,
        <strong>
            <span id="email-name-display"></span>
        </strong>
    </p>

    <button class="btn-estilo-ui" onclick="showCertificate()">
        ABRIR RECONOCIMIENTO
    </button>
</div>

<div id="certificate-view">

    <div class="certificate-header">
        <h1>DIPLOMADO VIP</h1>
        <p class="subtitle">
     Otorgado con honor y distinción
        </p>
    </div>

    <div class="gold-line"></div>

    <p class="certificate-text">
        Se hace constar que
    </p>

    <span class="name-highlight" id="certificate-name-display"></span>

    <p class="certificate-text">
Por cer tan excepcional 
con la bebida y el ambiente 
en cada celebración.
</p>

    <p class="title-highlight" id="title-display"></p>

    <div class="seal">
        VIP
    </div>

    <div class="certificate-footer">

        <div class="signature">
            <div class="signature-line"></div>
            Comité Organizador
        </div>

        <div class="date">
            <div class="signature-line"></div>
            Año 2026
        </div>

    </div>

</div>

<script>

let userName = "";
let userGender = "";

function showEmail() {

    userName = document.getElementById('name-input').value.trim();
    userGender = document.getElementById('gender-select').value;

    if(userName === ""){
        alert("Ingresa tu nombre.");
        return;
    }

    document.getElementById('initial-form').style.display = 'none';
    document.getElementById('email-view').style.display = 'block';

    document.getElementById('recipient-name').textContent = userName;
    document.getElementById('email-name-display').textContent = userName;
}

function showCertificate() {

    document.getElementById('email-view').style.display = 'none';
    document.getElementById('certificate-view').style.display = 'block';

    let titleText =
        userGender === "female"
        ? "REINA DE LA FIESTA"
        : "REY DE LA FIESTA";

    document.getElementById('certificate-name-display').textContent =
        userName.toUpperCase();

    document.getElementById('title-display').textContent =
        titleText;

    // Reproducir música
    const music = document.getElementById("celebrationMusic");
    music.volume = 0.7;
    music.play().catch(() => {});

    // Explosión inicial
    confetti({
        particleCount: 300,
        spread: 180,
        origin: { y: 0.6 }
    });

    // Lluvia de confeti
    const duration = 6000;
    const animationEnd = Date.now() + duration;

    const interval = setInterval(() => {

        if (Date.now() > animationEnd) {
            clearInterval(interval);
            return;
        }

        confetti({
            particleCount: 15,
            angle: 60,
            spread: 70,
            origin: { x: 0 }
        });

        confetti({
            particleCount: 15,
            angle: 120,
            spread: 70,
            origin: { x: 1 }
        });

    }, 250);

    // Fuegos artificiales
    setTimeout(() => {

        const fireworkEnd = Date.now() + 4000;

        const fireworks = setInterval(() => {

            if (Date.now() > fireworkEnd) {
                clearInterval(fireworks);
                return;
            }

            confetti({
                particleCount: 120,
                spread: 360,
                startVelocity: 45,
                ticks: 200,
                origin: {
                    x: Math.random(),
                    y: Math.random() * 0.5
                }
            });

        }, 500);

    }, 1000);
}

</script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

<audio id="celebrationMusic">
    <source src="musica.mp3" type="audio/mpeg">
</audio>

</body>
</html>
